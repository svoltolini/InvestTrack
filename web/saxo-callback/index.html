<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Returning to InvestTrack…</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #fbfaf8; color: #1f2328;
    font-family: system-ui, -apple-system, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 320px; text-align: center;
  }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 18px;
    border: 3px solid #d8dce2; border-top-color: #3d6ee0;
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 14px; color: #5c636b; line-height: 1.5; margin: 0; }
  a { color: #3d6ee0; }
</style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Returning to InvestTrack…</h1>
    <p>If the app doesn't reopen automatically,
       <a id="link" href="#">tap here to continue</a>.</p>
  </div>
  <script>
    // Forward Saxo's OAuth response (?code=&state=) to the app's custom scheme.
    // ASWebAuthenticationSession inside the app intercepts this redirect.
    // The one-time code is useless without the app's PKCE verifier, which
    // never leaves the device; nothing here is logged or sent elsewhere.
    (function () {
      var target = "investtrack://saxo-callback" + window.location.search;
      var link = document.getElementById("link");
      link.setAttribute("href", target);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
